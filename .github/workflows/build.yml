name: Build & deploy khtcard

# Trigger CHI o dung file luon la commit CHOT cua moi thao tac CMS (Luu/Xoa san pham) -
# khong trigger theo ca thu muc data/** (se chay ngay tu commit dau tien/do dang cua 1 thao
# tac Luu nhieu commit: anh -> data/products.json, xem static-site-build.md muc 5).
on:
  push:
    paths:
      - "data/products.json"
      - "data/categories.json"
      - "data/free-templates.json"
      - "data/custom-designs.json"
      - "data/site-settings.json"
      - "data/chat-qa.json"
      # Sua thiet ke trang (templates/) hoac logic build cung phai build lai - khong thi
      # phai cho lan Luu tiep theo tren CMS moi thay doi moi len duoc site.
      - "templates/**"
      - "scripts/build.py"
      # Ha tang cung phai trigger deploy: doi ten Worker, doi model Gemini, sua rate limit
      # hay sua logic /api/chat deu KHONG nam trong data/ hay templates/, nen truoc day
      # chung khong bao gio duoc deploy tu dong.
      - "wrangler.toml"
      - "worker/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static site (scripts/build.py)
        run: python3 scripts/build.py

      # worker/knowledge.generated.js cung la dau ra cua build.py (system prompt cua tro ly
      # chat, dung lai tu noi dung site) - phai commit kem html/ de `wrangler deploy` o buoc
      # sau day len dung phien ban khop voi html/ vua build.
      - name: Commit generated html/ + worker/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add html/ worker/
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "CI: build html from data"
          git push

      # Cloudflare Workers Static Assets - needs 2 repo secrets (Settings > Secrets and
      # variables > Actions): CLOUDFLARE_API_TOKEN (Account > Workers Scripts > Edit
      # permission) and CLOUDFLARE_ACCOUNT_ID.
      # Deploy day len ca html/ (static assets) LAN worker/index.js (endpoint /api/chat).
      # GEMINI_API_KEY KHONG nam o day - no la Worker secret, dat 1 lan bang
      # `npx wrangler secret put GEMINI_API_KEY` (xem README).
      - name: Deploy to Cloudflare (Workers Static Assets + /api/chat)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Ghim wrangler 4: mac dinh cua action la 3.90.0, KHONG hieu `run_worker_first`
          # va `[[ratelimits]]` trong wrangler.toml -> deploy se hong hoac bo qua binding.
          wranglerVersion: "4"
          command: deploy
