# Cloudflare Worker (Static Assets) config for khtcard (Kyu Craft) - Cloudflare has folded
# "Pages" into the Workers model, so there's no separate Pages project to create. This
# Worker serves html/ AND hosts one server-side endpoint, /api/chat (see worker/index.js).
# Ten Worker THAT tren Cloudflare (khac ten thu muc repo o local, von la "khtcard").
# Sai ten o day = wrangler tao ra mot Worker moi thay vi cap nhat production, va secret
# gan theo tung Worker nen key cung se nam nham cho.
name = "ourcard"
compatibility_date = "2026-08-23"

# Truoc day Worker nay khong co code (chi phuc vu file tinh). Gio no chay worker/index.js
# CHI cho /api/* (xem run_worker_first ben duoi) de lam proxy goi Gemini - API key phai nam
# server-side, khong duoc xuong trinh duyet.
main = "./worker/index.js"

[assets]
directory = "./html"
# Worker doc file tinh qua binding nay (env.ASSETS.fetch) cho moi duong dan khong phai /api/*.
binding = "ASSETS"
# Chi /api/* moi chay Worker truoc; moi duong dan khac van uu tien file tinh y nhu truoc,
# nen html_handling/not_found_handling ben duoi giu nguyen hanh vi cu.
run_worker_first = ["/api/*"]
# IMPORTANT: keep the existing .html-suffixed URLs (do not let Cloudflare auto-redirect
# "/shop-all/index.html" -> "/shop-all/") - the default html_handling would do exactly that.
html_handling = "none"
# Multi-page static site (not an SPA) - unknown paths should get a real 404, not a fallback
# to index.html. Serves html/404.html with an actual HTTP 404 status.
not_found_handling = "404-page"

# Smart Placement: Gemini CHAN theo vi tri dia ly, ma Worker mac dinh chay o colo gan
# khach nhat - khach Viet Nam -> colo Hong Kong -> Google tra 400 "User location is not
# supported". Bat smart placement de Cloudflare tu doi cho chay Worker ve gan backend
# (thuong la US), noi Gemini cho phep.
#
# LUU Y: chi anh huong fetch handler (tuc /api/chat). File tinh VAN luon duoc phuc vu tu
# colo gan khach nhat, nen toc do trang web khong bi cham di.
#
# DA THU, KHONG AN (26/08/2026): 34 request trong 17 phut, ca 34 deu tra ve header
# `cf-placement: local-HKG` - Cloudflare khong he doi cho chay. Ly do: no can "luu luong on
# dinh tu NHIEU vi tri" moi quyet dinh duoc, ma site chua co khach thuc. Giu lai cau hinh
# nay vi no vo hai va co the tu kich hoat khi site dong khach hon, NHUNG dung trong cho no
# de go chan dia ly Gemini - phai dung GAS lam proxy hoac bat billing.
[placement]
mode = "smart"

# Model Gemini dung cho widget chat. Doi o day (rot roi `wrangler deploy`) neu muon dung
# ban khac - khong phai sua code.
[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"

# Worker KHONG goi thang Gemini: Google chan theo vi tri va Worker chay o colo gan khach
# nhat (khach VN -> Hong Kong -> bi chan). GAS chay tren ha tang cua chinh Google nen goi
# duoc, vi vay Worker nho GAS goi ho qua doPost({action:"chat"}) - xem handleChatRelay_
# trong gas/Code.js.
#
# Day dung la URL /exec ma html/js/lead-form.js dang dung (form lien he), khong phai
# deployment khac - 1 GAS web app phuc vu ca hai.
#
# XOA dong nay di la Worker tu dong quay lai goi thang Google. Chi lam vay SAU KHI bat
# billing cho Gemini, vi tra phi thi khong con bi chan dia ly.
GEMINI_RELAY_URL = "https://script.google.com/macros/s/AKfycbze46G0S-cX3WGMfxD73hiF0nXYCNRe7THG1inp_5Nc25ayh-jyTtEGKr80LR9bRJFQ/exec"

# Chan spam vao /api/chat. Binding nay dem theo tung Cloudflare location va "eventually
# consistent" - du de chan lam dung, khong phai he thong tinh cuoc chinh xac.
# period CHI nhan 10 hoac 60 (giay).
[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
